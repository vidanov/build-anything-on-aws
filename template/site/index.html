<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from AWS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>It works.</h1>
  <p>This page comes from a private S3 bucket through CloudFront.</p>
  <p>Visits: <strong id="visits">…</strong></p>
  <script>
    // config.json is written next to index.html by the deploy workflow with the API URL.
    fetch('config.json')
      .then((r) => r.json())
      .then((cfg) => fetch(cfg.apiUrl + '/visits', { method: 'POST' }))
      .then((r) => r.json())
      .then((d) => { document.getElementById('visits').textContent = d.visits; })
      .catch(() => { document.getElementById('visits').textContent = 'API not connected yet'; });
  </script>
</body>
</html>
